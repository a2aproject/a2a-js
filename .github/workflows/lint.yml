name: Run Linter & Formatter

on:
  push:
    branches: [ "main", "epic/**" ]
  pull_request:
    branches: [ "main", "epic/**" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'

jobs:
  eslint:
    if: ${{ github.event.pull_request.user.login != 'a2a-bot' }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup
      with:
        node-version: 20
        registry-url: 'https://registry.npmjs.org'
    - run: npm ci
      working-directory: src/samples
    - run: npm run lint:ci
