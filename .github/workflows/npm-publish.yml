# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish to NPM

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # Now configure with the publish service for install.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://wombat-dressing-room.appspot.com/'

      - name: Publish to NPM
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
            VERSION=$(node -p "require('./package.json').version")
            npm dist-tag add "@a2a-js/sdk@${VERSION}" next
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-failure:
    if: failure()
    runs-on: ubuntu-latest
    needs:
      - publish-npm
    permissions:
      issues: write

    steps:
      - name: Open and pin an issue for the failed publish
        env:
          ASSIGNEES: "bartek-gralewicz,ishymko,JakubWorek"
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n\n%s\n' \
            "$TAG is not on NPM. The publish workflow failed." \
            "Failed run: $RUN_URL" > body.md

          url="$(gh issue create --repo "$REPO" \
            --title "Publish failed for $TAG" \
            --label 'component: tooling' \
            --body-file body.md)"
          echo "Opened $url"

          # Assigning and pinning must never discard the alert itself.
          gh issue edit "$url" --add-assignee "$ASSIGNEES" \
            || echo "::warning::Could not assign $url"
          gh issue pin "$url" \
            || echo "::warning::Could not pin $url. A repository allows at most 3 pinned issues."
