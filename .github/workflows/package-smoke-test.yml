# Packs the SDK, installs the tarball into a throwaway project and runs `a2a-db --help`.
# Every other workflow runs against the repo checkout, so a file left out of the
# package or a broken `bin` path would pass them and fail only for users.

name: Run Package Smoke Test

on:
  push:
    branches: ['main', 'epic/**']
  pull_request:
    branches: ['main', 'epic/**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'
      - 'test/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Kysely 0.28 is the last line supporting Node 20.
        include:
          - node-version: 20
            kysely: '0.28.17'
          # No version: the script uses the Kysely in package-lock.json.
          - node-version: 22
          - node-version: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:package
        env:
          KYSELY_VERSION: ${{ matrix.kysely }}
