# Packs the SDK, installs the tarball into a throwaway project and runs `a2a-db --help`.
# Every other workflow runs against the repo checkout, so a file left out of the
# package or a broken `bin` path would pass them and fail only for users.

name: Run Package Smoke Test

on:
  push:
    branches: ['main', 'epic/**']
  pull_request:
    branches: ['main', 'epic/**']
    paths:
      - 'src/**'
      - '!src/samples/**'
      - 'tsup.config.ts'
      - 'scripts/package_smoke_test.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/actions/setup/**'
      - '.github/workflows/package-smoke-test.yml'

jobs:
  smoke:
    if: ${{ github.event.pull_request.user.login != 'a2a-bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Kysely 0.28 is the last line supporting Node 20.
        include:
          - node-version: 20
            kysely: '0.28.17'
          # No version: the script uses the Kysely in package-lock.json.
          - node-version: 22
          - node-version: 24
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
      - run: npm run test:package
        env:
          KYSELY_VERSION: ${{ matrix.kysely }}
