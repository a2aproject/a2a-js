name: Run ITK

on:
  push:
    branches: ["main", "epic/**"]
  pull_request:
    paths:
      - 'src/**'
      - '!src/samples/**'
      - 'itk/**'
      - 'package.json'
      - 'package-lock.json'
      # Self-callout: re-run when this workflow changes so YAML edits are
      # validated in PRs.
      - '.github/workflows/run-itk.yaml'

permissions:
  contents: read

env:
  # Revision of the a2a-itk repo (https://github.com/a2aproject/a2a-itk)
  # whose `protos/instruction.proto`, `agents/{go,python}/v{03,v10}/`
  # baselines, and `Dockerfile` drive the cross-SDK compatibility harness.
  # Pinned to `main` (matching a2a-python's `itk.yaml` and a2a-go's
  # `itk.yaml`) so all SDKs run against the same source of truth.
  A2A_ITK_REVISION: main

# Only run the latest job for a given ref
concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  itk-test:
    name: ITK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Clone a2a-itk
        uses: actions/checkout@v7
        with:
          repository: a2aproject/a2a-itk
          ref: main
          path: itk/a2a-itk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build itk_service image (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: itk/a2a-itk
          tags: itk_service:latest
          load: true
          cache-from: type=gha,scope=itk_service
          cache-to: type=gha,mode=max,scope=itk_service

      - name: Cache launcher peer-SDK checkouts + build outputs
        uses: actions/cache@v6
        with:
          path: ~/.cache/a2a-itk-launcher
          key: itk-launcher-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            itk-launcher-${{ runner.os }}-

      - name: Run Error Handling Tests
        run: bash itk/run_error_tests.sh

      - name: Run ITK Tests (PR scenarios)
        run: bash run_itk.sh
        working-directory: itk
        env:
          A2A_ITK_REVISION: ${{ env.A2A_ITK_REVISION }}
          ITK_SKIP_BUILD: "1"
