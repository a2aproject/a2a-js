name: Run ACTS (Nightly)

# Conformance counterpart of `run-itk-nightly.yaml`, on the same schedule.
# Separate workflows so neither shows up red for the other's failure and each
# can be re-run on its own.

on:
  schedule:
    # 02:00 UTC daily, alongside the traversal nightly.
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual execution from the Actions tab

permissions:
  # Required for `softprops/action-gh-release` to publish the rolling
  # `nightly-metrics` prerelease asset.
  contents: write

# Only cancel earlier in-flight runs for the SAME git ref, so a manual
# `workflow_dispatch` on a feature branch cannot cancel a running cron.
concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  acts:
    name: Nightly ACTS Run
    runs-on: ubuntu-latest

    env:
      # Same pin as the PR workflow — see `.github/workflows/run-acts.yaml`.
      A2A_ITK_REVISION: main

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Clone a2a-itk
        uses: actions/checkout@v7
        with:
          repository: a2aproject/a2a-itk
          ref: main
          path: itk/a2a-itk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build itk_service image (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: itk/a2a-itk
          tags: itk_service:latest
          load: true
          cache-from: type=gha,scope=itk_service
          cache-to: type=gha,mode=max,scope=itk_service

      - name: Cache launcher peer-SDK checkouts + build outputs
        uses: actions/cache@v6
        with:
          path: ~/.cache/a2a-itk-launcher
          key: itk-launcher-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            itk-launcher-${{ runner.os }}-

      - name: Run Nightly ACTS Conformance
        run: bash run_itk.sh
        working-directory: itk
        env:
          A2A_ITK_REVISION: ${{ env.A2A_ITK_REVISION }}
          ITK_ACTS_RUN: "1"
          ITK_ACTS_TRANSPORTS: jsonrpc,grpc,rest
          # Unlike the PR tier this does NOT gate on conformance: a `must`
          # failure is the metric being recorded, not a broken run. The step
          # fails only if the service errored or the report came back
          # malformed, which is exactly when publishing should be skipped.
          ITK_NIGHTLY_RUN: "True"
          ITK_SKIP_BUILD: "1"

      - name: Upload ACTS reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acts-reports-js-nightly
          path: itk/acts-report-*.json
          if-no-files-found: warn
          # Outlives the rolling asset's 7-run window, so every entry it
          # carries still has its full report to link to.
          retention-days: 30

      - name: Upload ACTS Results to Rolling Release
        uses: softprops/action-gh-release@v3
        with:
          # The conformance counterpart of `itk_js.json`, on the same permanent
          # tag: `process_acts_results.py` fetches
          # `.../download/nightly-metrics/acts_js.json`, appends one entry
          # covering all three bindings, and the upload puts it back.
          tag_name: nightly-metrics
          prerelease: true
          files: |
            itk/acts_js.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
