# Ensures no accidental Node.js API usage in browser and Edge compatible
# entrypoints, and that transport-scoped entrypoints resolve only their
# declared peers. `scripts/test_build.mjs` bundles four isolated profiles
# via esbuild with an import-allowlist plugin:
#   1. workers-safe (platform=neutral): only `jose`; no optional peers or
#      Node built-ins.
#   2. grpc (platform=node): `jose`, `@grpc/grpc-js`, `@bufbuild/protobuf`,
#      and Node built-ins.
#   3. express (platform=node): `jose`, `express`, and Node built-ins.
#   4. database (platform=neutral): `jose` and `kysely`; no Node built-ins.

name: Run Build Tests

on:
  push:
    branches: [ "main", "epic/**" ]
  pull_request:
    branches: [ "main", "epic/**" ]
    paths:
      - 'src/**'
      - '!src/samples/**'
      - 'scripts/test_build.mjs'
      - 'tsup.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/actions/setup/**'
      - '.github/workflows/build-tests.yml'

jobs:
  test:
    if: ${{ github.event.pull_request.user.login != 'a2a-bot' }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup
      with:
        node-version: 20
        registry-url: 'https://registry.npmjs.org'
    - run: npm run build
    - run: npm run test-build
