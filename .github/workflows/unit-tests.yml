# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Run Unit Tests

on:
  push:
    branches: [ "main", "epic/**" ]
  pull_request:
    branches: [ "main", "epic/**" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'
      - 'src/samples/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22, 24]
    # The migration suite runs against every engine it supports.
    # Both health checks go over TCP as the application user. While initialising, each
    # image runs a temporary server that answers on its socket only, so a socket probe
    # reports healthy seconds before the real server accepts a connection.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: a2a
          POSTGRES_PASSWORD: a2a_password
          POSTGRES_DB: a2a_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U a2a -d a2a_test" --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        # 8.0 or newer: utf8mb4_0900_bin, the collation the key columns depend on, does
        # not exist before it.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: a2a_test
          MYSQL_USER: a2a
          MYSQL_PASSWORD: a2a_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=TCP -h 127.0.0.1 -u a2a -pa2a_password" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
    - run: npm ci
    - run: npm test
    # Run apart, and serially: the suites drop and recreate the same tables.
    # The suites skip an engine they cannot reach. Every engine is reachable here, so a
    # skip would mean this job is misconfigured; the flag turns that into a failure.
    - name: Database suites against PostgreSQL and MySQL
      run: >-
        npx vitest run --no-file-parallelism
        test/server/database_push_notification_migrations.spec.ts
        test/server/database_push_notification_store.spec.ts
        test/server/database_task_migrations.spec.ts
      env:
        POSTGRES_TEST_DSN: postgresql://a2a:a2a_password@localhost:5432/a2a_test
        MYSQL_TEST_DSN: mysql://a2a:a2a_password@localhost:3306/a2a_test
        A2A_TEST_REQUIRE_ALL_ENGINES: '1'

  # Edge runtime tests use @edge-runtime/vm to emulate Cloudflare Workers,
  # Vercel Edge Functions, and similar environments. This ensures the SDK
  # works correctly in non-Node.js server environments.
  test-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
    - run: npm ci
    - run: npm run test:edge

  # Run coverage once to generate a report.
  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Base Branch
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.ref || 'main' }}
        clean: true

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'

    - name: Install & Test (Base Branch)
      timeout-minutes: 10
      run: |
        npm ci
        npm run coverage
        mv coverage/coverage-summary.json ${{ runner.temp }}/coverage-base-summary.json
    
    - name: Upload Artifact (base)
      uses: actions/upload-artifact@v7
      if: github.event_name != 'pull_request'
      with:
        name: coverage-report
        path: coverage
        retention-days: 14

    - name: Checkout PR Branch
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v7
      with:
        clean: true

    - name: Install & Test (PR)
      if: github.event_name == 'pull_request'
      timeout-minutes: 10
      run: |
        npm ci
        npm run coverage
        mv coverage/coverage-summary.json coverage-pr-summary.json
        mv ${{ runner.temp }}/coverage-base-summary.json coverage-base-summary.json
    
    - name: Save PR number
      run: |
        echo ${{ github.event.number }} > ./PR_NUMBER
    
    - name: Upload Coverage Artifacts
      uses: actions/upload-artifact@v7
      if: github.event_name == 'pull_request'
      with:
        name: coverage-data
        path: |
          coverage-base-summary.json
          coverage-pr-summary.json
          coverage/
          PR_NUMBER
        retention-days: 1
